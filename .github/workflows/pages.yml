name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Weather App
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/app/
      - name: Assemble Pages site
        run: |
          mkdir -p _site/app
          cp -R docs/. _site/
          cp -R dist/. _site/app/
          cp -R workshop _site/workshop
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4